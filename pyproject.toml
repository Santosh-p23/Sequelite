[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sequelite"
version = "0.1.0"
description = "An educational SQLite-inspired database implemented from scratch"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
dependencies = []

[project.scripts]
sequelite = "sequelite.cli:main"

[tool.setuptools.packages.find]
include = ["sequelite*"]
